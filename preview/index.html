<script>

ty="0"/></linearGradient></defs><path d="M20 65H520M20 120H520M20 175H520M20 230H520" stroke="var(--chart-grid)" stroke-dasharray="4 8"/><path d="M20 205C75 190 80 140 122 160S186 110 228 126 282 81 339 110 400 59 438 85 494 42 520 54V232H20Z" fill="url(#fill)"/><path d="M20 205C75 190 80 140 122 160S186 110 228 126 282 81 339 110 400 59 438 85 494 42 520 54" fill="none" stroke="var(--accent)" stroke-width="4"/></svg><div class="chart-labels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></div></section><section class="surface-card weather-card"><div class="section-head"><div><div class="section-eyebrow">LOCAL CONDITIONS</div><h3>Weather outlook</h3></div><span>☀️</span></div><div class="weather-main"><div><span class="weather-temp">28°</span><p>Partly cloudy · Pune</p></div><span class="weather-sun">☀</span></div><div class="weather-detail"><span>💧 64% humidity</span><span>〰 12 km/h winds</span></div><div class="forecast">${[['MON','☀️','28°'],['TUE','🌤','29°'],['WED','🌤','27°'],['THU','☀️','30°']].map(x=>`<div><small>${x[0]}</small><span>${x[1]}</span><strong>${x[2]}</strong></div>`).join('')}</div><p class="tiny-disclaimer">Illustrative forecast, not live weather.</p></section></div><div class="bottom-grid"><section class="surface-card focus-card"><div class="section-head"><div><div class="section-eyebrow">CURATED FOR YOU</div><h3>Today's focus</h3></div><button class="text-arrow" data-route="Plant Doctor">Plant care →</button></div>${[['💧','Check irrigation schedule','Monitor field moisture before watering'],['🌱','Review your crop symptoms','Use Plant Doctor to organize observations'],['🛒','Explore buyer requirements','Discover produce opportunities nearby']].map(x=>`<div class="task-row"><span class="task-icon green">${x[0]}</span><div><strong>${x[1]}</strong><small>${x[2]}</small></div> › </div>`).join('')}</section><section class="surface-card mandi-mini"><div class="section-head"><div><div class="section-eyebrow">MARKET INTELLIGENCE</div><h3>Mandi snapshot</h3></div><button class="text-arrow" data-route="Insights">See all →</button></div>${[['🍅','Tomato','Pune','₹1,750','+3.8%'],['🧅','Onion','Lasalgaon','₹2,170','+1.6%'],['🌾','Soybean','Latur','₹4,320','−0.8%']].map(x=>`<div class="mandi-mini-row"><div class="crop-round">${x[0]}</div><div><strong>${x[1]}</strong><small>${x[2]}</small></div><strong class="mandi-val">${x[3]}</strong><span class="${x[4].startsWith('+')?'positive':'negative'}">${x[4]}</span></div>`).join('')}<p class="tiny-disclaimer">Sample prices for UI demonstration only.</p></section></div>`}
else if(page==='Plant Doctor'){html=heading('SMART CROP CARE','Meet your Plant Doctor ✳','Understand plant symptoms and take the next step with confidence.')+`<section class="doctor-header"><div><div class="hero-kicker">YOUR CROP CARE ASSISTANT</div><h2>A little attention.<br><em>A healthier harvest.</em></h2><p>Upload your plant photo and explore an example of guided crop screening.</p></div><div class="doctor-art">${plant()}</div></section><div class="doctor-grid"><section class="surface-card scan-form"><div class="section-head"><div><div class="section-eyebrow">STEP 01 · ADD A PHOTO</div><h3>Scan your crop</h3></div><span class="small-status">● Prototype</span></div><input type="file" accept="image/*" id="photo" hidden><div class="dropzone" id="uploadzone">${photo?`<img class="upload-preview" src="${photo}" alt="Local preview"><span class="image-overlay">Change image</span>`:`<div class="drop-icon">◎</div><strong>Choose a plant photograph</strong><p>Click to capture or upload</p><small>JPG, PNG or WebP · up to 10 MB</small>`}</div><div class="form-row"><label>Which crop?<select id="crop"><option>Tomato</option><option>Onion</option><option>Soybean</option><option>Cotton</option></select></label><label>What have you noticed?<select><option>Yellowing / leaf spots</option><option>Wilting / drooping</option><option>Insect damage</option><option>Not sure yet</option></select></label></div><button id="scan" class="btn btn-primary full">✳ Preview guided screening →</button><div class="scan-warning">ⓘ This staging UI does not analyze, send or diagnose an uploaded photo.</div></section><section class="surface-card result-card"><div class="section-head"><div><div class="section-eyebrow">STEP 02 · CARE GUIDANCE</div><h3>Care companion</h3></div><span class="scan-badge">✳ AI-ready</span></div><div id="report"><div class="result-empty"><div class="result-empty-icon">🌱</div><strong>Every healthy harvest starts with understanding.</strong><p>Your example guidance appears here, with no actual disease inference in this version.</p><div class="feature-list"><span>✓ Structured observations</span><span>✓ Next steps</span><span>✓ Expert escalation</span></div></div></div></section></div>`}
else if(page==='Marketplace'){html=heading('KRISHIGO MARKET','Grow it. Find it. Trade it.','Discover agricultural produce, equipment and useful farm services.')+`<section class="market-banner"><div><div class="section-eyebrow">FARM TO MARKET, CONNECTED</div><h2>Good harvests deserve<br>great opportunities.</h2><p>Find buyers and services for your farming journey.</p></div><div class="market-art"><div class="market-emoji">🌽</div></div></section><div class="filterbar"><div class="category-pills">${['All','Produce','Equipment','Services','Saved'].map(c=>`<button data-filter="${c}" class="${filter===c?'active':''}">${c}</button>`).join('')}</div><span class="filter-count">☰ &nbsp; Demo listings</span></div><div class="product-grid">${sample.filter((l,i)=>(filter==='All'||l[4]===filter||(filter==='Saved'&&saved.has(i))) && (filter!=='Saved'||saved.has(i))).map((x,i)=>{const idx=sample.indexOf(x);return `<article class="product-card"><div class="product-image ${x[5]}"><span class="product-illustration">${x[0]}</span><span class="product-tag">Demo listing</span><button class="save-button ${saved.has(idx)?'is-saved':''}" data-save="${idx}">${saved.has(idx)?'♥':'♡'}</button></div><div class="product-detail"><div class="product-location">⌖ ${x[2]}</div><h3>${x[1]}</h3><div class="price-row"><strong>${x[3]}</strong><small> / unit</small></div><div class="product-bottom"><span>Fictional seller</span><span class="seller-name">✓ Sample only</span></div><button class="contact-btn" data-contact="${idx}">View opportunity →</button></div></article>`}).join('')}</div><p class="page-disclaimer">ⓘ Fictional prices and listings, no transactions or messaging.</p>`}
else if(page==='Community'){html=heading('FARMER COMMUNITY','Better together, every season.','Trade knowledge, ask questions and share field experiences.')+`<section class="community-hero"><div class="community-hero-icon">♧</div><div><div class="section-eyebrow">KRISHIGO CIRCLE</div><h2>Where farmers help farmers grow.</h2><p>Questions, field stories, perspectives and meaningful connections.</p></div></section><div class="community-layout"><div class="post-feed"><div class="feed-tabs"><strong>Community feed</strong><span class="feed-count">In-memory demo</span></div><div class="surface-card composer"><strong>Join the conversation</strong><textarea id="post-text" placeholder="What's happening on your farm?" maxlength="1000"></textarea><div class="composer-actions"><span>Staging sample only</span><button class="btn btn-primary" id="publish">Publish to demo feed ↗</button></div></div>${posts.map((p,i)=>`<article class="surface-card community-post"><div class="post-head"><div class="post-person"><span class="post-avatar">${p[0]}</span><div><strong>${p[1]}</strong><small>Community member · Demo</small></div></div><span class="post-topic">Discussion</span></div><p>${p[2]}</p><div class="post-actions"><button data-like="${i}" class="${likes.has(i)?'liked':''}">${likes.has(i)?'♥':'♡'} ${p[3]+(likes.has(i)?1:0)} Helpful</button><button data-reply="${i}">○ Replies</button></div></article>`).join('')}</div><aside class="community-right"><div class="surface-card conversation-card"><span class="small-kicker">TRENDING TOPICS</span><h3>What farmers are discussing</h3>${[['🌱','Crop health'],['💧','Water management'],['📈','Market prices'],['🚜','Farm equipment']].map(x=>`<button><span>${x[0]}</span><div><strong>${x[1]}</strong><small>Open discussion</small></div>›</button>`).join('')}</div><div class="community-join"><h3>Your knowledge can help another farmer.</h3><p>Share a thoughtful field observation.</p></div></aside></div>`}
else{html=heading('MARKET & FARM INTELLIGENCE','Make every decision count.','Explore how mandi information and farm trends come together.')+`<div class="insights-banner"><div><div class="section-eyebrow">DATA, WITH PURPOSE</div><h2>Clarity from field<br>to market.</h2><p>Verified prices and trends will appear after integration.</p></div><div class="insights-big-number"><small>ILLUSTRATIVE SIGNAL</small><strong>+5.4%</strong></div></div><div class="insights-grid"><section class="surface-card insights-chart"><div class="section-head"><div><div class="section-eyebrow">COMMODITY OVERVIEW</div><h3>Market activity trends</h3><p>Example trend chart</p></div></div><div class="growth-legend"><span><i class="legend-mark"></i> Sample trend</span><strong>+5.4%</strong></div><svg width="100%" viewBox="0 0 500 240"><path d="M20 65H480M20 110H480M20 155H480M20 200H480" stroke="var(--chart-grid)" stroke-dasharray="3 7"/><path d="M20 190Q80 155 124 162T220 110T310 134T400 77T480 44" fill="none" stroke="var(--accent)" stroke-width="4"/></svg></section><section class="surface-card insights-metrics"><div class="section-eyebrow">FIELD METRICS</div><h3>Environmental snapshot</h3><div class="metric-box lime"><span>💧 Water oversight</span><strong>64<span>%</span></strong><small>Example moisture index</small></div><div class="metric-split"><div><strong>28°</strong><small>Temperature</small></div><div><strong>86%</strong><small>Crop health</small></div></div></section></div><section class="surface-card market-table"><div class="section-head"><div><div class="section-eyebrow">MANDI EXPLORER</div><h3>Sample commodity prices</h3></div><span class="small-status">● No live feed</span></div><div class="table-wrap"><table><thead><tr><th>Market</th><th>Commodity</th><th>Minimum</th><th>Maximum</th><th>Average</th><th>Change</th></tr></thead><tbody>${[['Pune','Tomato','₹1,400','₹2,050','₹1,750','+3.8%'],['Lasalgaon','Onion','₹1,900','₹2,450','₹2,170','+1.6%'],['Latur','Soybean','₹4,080','₹4,550','₹4,320','−0.8%']].map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="tiny-disclaimer">All prices and changes are fictional sample data.</p></section>`}
document.querySelector('#screen').innerHTML=html+`<footer class="footer"><div>✳ &nbsp; KrishiGo · Designed for the next generation of farming</div><span>Staging prototype · no database · sample information</span></footer>`;

document.addEventListener('click',e=>{let n=e.target.closest('[data-route]');if(n){page=n.getAttribute('data-route');document.querySelector('#sidebar').classList.remove('sidebar-open');show();scrollTo(0,0)}n=e.target.closest('[data-theme]');if(n){document.querySelector('#app').className='app-shell theme-'+n.dataset.theme;document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('current',b===n))}n=e.target.closest('[data-filter]');if(n){filter=n.dataset.filter;show()}n=e.target.closest('[data-save]');if(n){let i=+n.dataset.save;saved.has(i)?saved.delete(i):saved.add(i);show()}n=e.target.closest('[data-contact]');if(n)alert('Sample listing only. Buyer enquiries need verified PHP API and real accounts.');n=e.target.closest('[data-like]');if(n){let i=+n.dataset.like;likes.has(i)?likes.delete(i):likes.add(i);show()}if(e.target.closest('[data-reply]'))alert('Replies will be enabled when the PHP API is connected.');if(e.target.closest('#open-menu'))document.querySelector('#sidebar').classList.toggle('sidebar-open');if(e.target.closest('#uploadzone'))document.querySelector('#photo').click();if(e.target.closest('#scan'))document.querySelector('#report').innerHTML=`<div class="result-content"><div class="result-banner"><span class="result-icon">🌱</span><div><small>SAMPLE REPORT — NOT A DIAGNOSIS</small><strong>Possible leaf stress symptoms</strong><p>Different diseases, nutrition problems and weather stresses can look similar.</p></div></div><div class="care-steps" style="margin-top:24px"><div><span>01</span><p>Take photos of the whole plant and the affected leaf.</p></div><div><span>02</span><p>Record weather, irrigation and symptom duration.</p></div><div><span>03</span><p>Ask a qualified local agronomist for diagnosis and treatment guidance.</p></div></div></div>`;if(e.target.closest('#publish')){let t=document.querySelector('#post-text');if(t&&t.value.trim()){posts.unshift(['DF','Demo Farmer',safeText(t.value.trim()),0]);show()}}});document.addEventListener('change',e=>{if(e.target.id==='photo'){const f=e.target.files[0];if(f&&f.type.startsWith('image/')&&f.size<=10*1024*1024){if(photo)URL.revokeObjectURL(photo);photo=URL.createObjectURL(f);show()}}});show();

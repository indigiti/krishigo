name: M13 Cloudways staging probe (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staging URL, anonymous API boundary and external latency
        run: python3 tools/probe_cloudways_staging.py
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krishigo-m13-cloudways-probe
          path: reports/m13-cloudways-probe.json
          if-no-files-found: warn
          retention-days: 14
  browser-experience:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Measure host performance in real remote Chromium
        run: npx playwright test --config playwright.remote.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krishigo-m13-cloudways-browser
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: warn
          retention-days: 14

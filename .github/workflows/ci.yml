name: KrishiGo staging CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (lockfile not yet published)
        run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build database-free staging app
        run: npm run build
        env:
          VITE_DATA_MODE: mock
          VITE_API_BASE_URL: ''
      - name: Verify and package static staging artifact
        working-directory: .
        run: |
          python3 tools/test_package_staging.py
          python3 tools/test_package_digiops.py
          python3 tools/package_staging.py --output krishigo-staging-static.zip
          python3 tools/package_digiops.py --output release
      - name: Upload DigiOps release for public_html/krishigo/
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-staging-dist
          path: apps/web/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-staging-static-zip
          path: krishigo-staging-static.zip
          retention-days: 14
  browser:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: krishigo-staging-dist
          path: apps/web/dist
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile interactions
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krishigo-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP test API
        run: php -l apps/api-php/src/Core.php && php -l apps/api-php/public/index.php
      - name: Exercise PHP HTTP contracts
        run: python3 apps/api-php/tests/integration.py -v

name: KrishiGo staging CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (lockfile not yet published)
        run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build database-free staging app
        run: npm run build
        env:
          VITE_DATA_MODE: mock
          VITE_API_BASE_URL: ''
      - name: Verify web transfer-size budgets
        working-directory: .
        run: |
          python3 tools/test_web_budget.py
          python3 tools/check_web_budget.py
      - name: Verify and package static staging artifact
        working-directory: .
        run: |
          python3 tools/test_package_staging.py
          python3 tools/test_package_digiops.py
          python3 tools/package_staging.py --output krishigo-staging-static.zip
          python3 tools/package_digiops.py --output release
      - name: Upload DigiOps release for public_html/krishigo/
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-staging-dist
          path: apps/web/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-staging-static-zip
          path: krishigo-staging-static.zip
          retention-days: 14
  browser:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: krishigo-staging-dist
          path: apps/web/dist
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile interactions
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krishigo-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP test API
        run: php -l apps/api-php/src/Core.php && php -l apps/api-php/public/index.php
      - name: Exercise PHP HTTP contracts
        run: python3 apps/api-php/tests/integration.py -v

  production-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-only-in-ci
          MYSQL_DATABASE: krishigo_test
          MYSQL_USER: krishigo_ci
          MYSQL_PASSWORD: krishigo-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, openssl, session
          coverage: none
      - name: Lint production PHP modules
        run: |
          for f in apps/api-php/src/Production/*.php apps/api-php/bin/*.php apps/api-php/tests/*.php; do php -l "$f"; done
      - name: Exercise real multi-user persistence with isolated MySQL
        env:
          KRISHIGO_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=krishigo_test;charset=utf8mb4'
          KRISHIGO_DB_USER: krishigo_ci
          KRISHIGO_DB_PASSWORD: krishigo-ci-only-password
          KRISHIGO_RATE_SALT: krishigo-ci-only-not-a-deployable-secret-2026
        run: python3 apps/api-php/tests/production_integration.py -v

name: KrishiGo staging CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Staging source has no lockfile yet; produce one once registry access is available.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_MODE: mock
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-staging-dist
          path: apps/web/dist
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint API
        run: php -l apps/api-php/src/Core.php && php -l apps/api-php/public/index.php
      - name: Exercise PHP HTTP contracts
        run: python3 apps/api-php/tests/integration.py -v

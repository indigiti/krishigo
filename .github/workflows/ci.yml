name: KrishiGo staging CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: krishigo-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (lockfile not yet published)
        run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build database-free staging app
        run: npm run build
        env:
          VITE_DATA_MODE: mock
          VITE_API_BASE_URL: ''
      - name: Verify web transfer-size budgets
        working-directory: .
        run: |
          python3 tools/test_web_budget.py
          python3 tools/check_web_budget.py
      - name: Verify M25 launch gates remain fail-closed
        working-directory: .
        run: python3 tools/check_platform_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-m25-readiness
          path: reports/m25-platform-readiness.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify and package static staging artifact
        working-directory: .
        run: |
          python3 tools/test_package_staging.py
          python3 tools/test_package_digiops.py
          python3 tools/package_staging.py --output krishigo-staging-static.zip
          python3 tools/package_digiops.py --output release
      - name: Upload DigiOps release for public_html/krishigo/
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Verify independent protected-PHP pilot bundle
        working-directory: .
        run: |
          python3 tools/test_package_php_pilot.py -v
          python3 tools/test_php_pilot_http.py -v
          python3 tools/package_php_pilot.py --output protected-pilot-review
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-protected-php-pilot-review
          path: protected-pilot-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-staging-dist
          path: apps/web/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-staging-static-zip
          path: krishigo-staging-static.zip
          retention-days: 14
  browser:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: krishigo-staging-dist
          path: apps/web/dist
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile interactions
        run: npm run test:e2e
      - name: Build opt-in shared JSON mode and verify module activation in Chromium
        run: |
          VITE_MODULE_CONTROL_MODE=api VITE_MODULE_API_BASE_URL=/api/v1 npm run build
          KG_TEST_SHARED=1 npx playwright test e2e/shared.spec.ts
      - name: Build JSON staging pilot and exercise editorial + operations
        run: |
          VITE_JSON_WORKFLOWS_MODE=api VITE_JSON_API_BASE_URL=/api/v1 npm run build
          KG_TEST_JSON=1 npx playwright test e2e/json.spec.ts e2e/connected.spec.ts e2e/module-contracts.spec.ts e2e/connected-inputs.spec.ts
      - name: Build production-candidate UI and exercise isolated platform screens
        run: |
          VITE_DATA_MODE=api VITE_API_BASE_URL=/api/v1 npm run build
          KG_TEST_PLATFORM=1 npx playwright test e2e/platform-operations.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krishigo-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP test API
        run: php -l apps/api-php/src/Core.php && php -l apps/api-php/public/index.php && php -l apps/api-php/src/Modules/Registry.php && php -l apps/api-php/src/Json/Store.php && php -l apps/api-php/src/Json/Services.php && php -l apps/api-php/src/Json/Doctor.php && php -l apps/api-php/src/Json/Contracts.php && php -l apps/api-php/src/Json/Api.php && php -l apps/api-php/src/Json/InputContracts.php && php -l apps/api-php/src/Json/Inputs.php && php -l apps/api-php/src/Production/PlatformCommon.php && php -l apps/api-php/src/Production/KnowledgeApi.php && php -l apps/api-php/src/Production/CommerceApi.php && php -l apps/api-php/src/Production/TradeJourney.php && php -l apps/api-php/src/Production/EngagementApi.php
      - name: Exercise PHP HTTP contracts
        run: python3 apps/api-php/tests/integration.py -v && python3 apps/api-php/tests/test_mode_boundary.py -v && python3 apps/api-php/tests/json_modules_integration.py -v && python3 apps/api-php/tests/json_workflows_integration.py -v && python3 apps/api-php/tests/json_store_concurrency.py -v && python3 apps/api-php/tests/inputs_integration.py -v
      - name: Synthetic local PHP latency baseline (not Cloudways RUM)
        run: python3 tools/benchmark_json_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: krishigo-m12-api-benchmark
          path: reports/m12-api-benchmark.json
          if-no-files-found: error
          retention-days: 14



  production-mysql:
    name: Isolated production-candidate MySQL regression
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: krishigo_test
          MYSQL_USER: kgtest
          MYSQL_PASSWORD: kgtest-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      KRISHIGO_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=krishigo_test;charset=utf8mb4"
      KRISHIGO_DB_USER: kgtest
      KRISHIGO_DB_PASSWORD: kgtest-ci-only
      KRISHIGO_RATE_SALT: ci-not-production-64-d9b4aa3a5877a24e17f93528d2189440
    steps:
      - uses: actions/checkout@v4
      - name: Enable PHP MySQL PDO extension
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-mysql
          php -m | grep -i pdo_mysql
      - name: Exercise existing M8 multiuser API on isolated MySQL
        run: python3 apps/api-php/tests/production_integration.py -v
      - name: Exercise M20-M25 platform contracts and cross-role isolation
        run: python3 apps/api-php/tests/platform_integration.py -v
